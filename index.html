<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limpieza de correo</title>
<style>
  :root{
    --ink:#1b1f1d;
    --paper:#f6f5f0;
    --panel:#ffffff;
    --line:#dedad0;
    --moss:#3f5d4c;
    --moss-dark:#2c4436;
    --rust:#b5502f;
    --muted:#7a7568;
    --danger:#a3312a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Courier New', ui-monospace, SFMono-Regular, monospace;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px;}
  header{
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  header h1{
    font-family:Georgia, 'Times New Roman', serif;
    font-size:1.5rem;
    letter-spacing:0.02em;
    margin:0;
  }
  header .tag{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.12em;}
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    padding:18px;
    margin-bottom:18px;
  }
  label{display:block;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:6px;}
  input[type=text]{
    padding:10px 12px;
    border:1px solid var(--line);
    background:var(--paper);
    font-family:inherit;
    font-size:0.9rem;
    color:var(--ink);
  }
  input[type=date]{
    padding:10px 8px;
    border:1px solid var(--line);
    background:var(--paper);
    font-family:inherit;
    font-size:0.82rem;
    color:var(--ink);
  }
  select{
    padding:10px 12px;
    border:1px solid var(--line);
    background:var(--paper);
    font-family:inherit;
    font-size:0.82rem;
    color:var(--ink);
    max-width:100%;
  }
  input[type=text]:focus, input[type=date]:focus, select:focus{outline:2px solid var(--moss);outline-offset:1px;}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  button{
    font-family:inherit;
    font-size:0.85rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:11px 18px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    flex-shrink:0;
  }
  button:hover{background:var(--moss-dark);border-color:var(--moss-dark);}
  button:disabled{opacity:0.45;cursor:default;}
  button.secondary{background:transparent;color:var(--ink);}
  button.secondary:hover{background:var(--ink);color:var(--paper);}
  button.danger{background:var(--danger);border-color:var(--danger);}
  button.danger:hover{background:#7d221d;border-color:#7d221d;}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .status{
    font-size:0.8rem;
    color:var(--muted);
    margin-top:10px;
    min-height:1.2em;
  }
  .status.err{color:var(--danger);}
  ul.results{list-style:none;margin:0;padding:0;}
  ul.results li{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  ul.results li:last-child{border-bottom:none;}
  ul.results input[type=checkbox]{
    margin-top:3px;
    width:16px;height:16px;
    accent-color:var(--moss);
    flex-shrink:0;
  }
  .meta{flex:1;min-width:0;}
  .meta .subj{font-size:0.88rem;color:var(--ink);}
  .meta .sub{font-size:0.75rem;color:var(--muted);margin-top:3px;}
  .empty{color:var(--muted);font-size:0.85rem;text-align:center;padding:24px 0;}
  .count{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;}
  .divider{border:none;border-top:1px dashed var(--line);margin:14px 0;}
  .spin{
    display:inline-block;width:12px;height:12px;
    border:2px solid var(--line);border-top-color:var(--moss);
    border-radius:50%;
    animation:sp 0.7s linear infinite;
    vertical-align:middle;margin-right:6px;
  }
  @keyframes sp{to{transform:rotate(360deg);}}
  .who.connected{font-size:0.78rem;font-weight:700;color:var(--moss);letter-spacing:0.02em;}
  .who.disconnected{font-size:0.78rem;font-weight:700;color:var(--danger);letter-spacing:0.02em;}
  .setupnote{
    font-size:0.75rem;
    color:var(--rust);
    border:1px dashed var(--rust);
    padding:10px 12px;
    margin-bottom:18px;
    display:none;
  }
  /* --- filas compactas: label + control + botón en una sola línea --- */
  .inline-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .inline-row + .inline-row{margin-top:10px;}
  .inline-row .inline-label{
    margin:0;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    flex-shrink:0;
  }
  .inline-row input[type=date]{width:118px;flex:0 0 auto;padding:10px 6px;}
  .inline-row select{width:auto;flex:1 1 130px;min-width:0;}
  .inline-row .icon-label{
    margin:0;
    font-size:1.1rem;
    flex-shrink:0;
    text-transform:none;
    letter-spacing:0;
  }
  textarea#senders{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    background:var(--paper);
    font-family:inherit;
    font-size:0.85rem;
    color:var(--ink);
    resize:vertical;
    line-height:1.4;
  }
  textarea#senders:focus{outline:2px solid var(--moss);outline-offset:1px;}
  .checkfield{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .checkfield input[type=checkbox]{width:16px;height:16px;accent-color:var(--moss);flex-shrink:0;}
  .checkfield label{margin:0;text-transform:none;letter-spacing:0;font-size:0.82rem;color:var(--ink);}
  #othersPanel.readonly .actions{display:none;}
  #othersPanel.readonly ul.results input[type=checkbox]{display:none;}
  .hint{font-size:0.7rem;color:var(--muted);margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Limpieza de correo</h1>
    <span class="tag">Gmail</span>
  </header>

  <div class="setupnote" id="setupNote">
    Falta configurar CLIENT_ID en el &lt;script&gt; (línea con <code>const CLIENT_ID</code>). Lee las instrucciones que te di aparte.
  </div>

  <div class="panel">
    <div class="inline-row">
      <select id="accountsSelect"><option>Sin cuentas conectadas</option></select>
      <button type="button" id="removeAccountBtn" class="secondary">Quitar</button>
      <button id="authBtn">Añadir cuenta</button>
    </div>
    <div class="status" id="whoami"></div>
  </div>

  <div class="panel">
    <div class="field">
      <label for="senders">Remitentes a buscar</label>
      <textarea id="senders" rows="2">temu.com, orders.temu.com, eu.temuemail.com, support.temu.com, aliexpress.com, mondoffice.com, kalamazoo.es, sygic.com</textarea>
    </div>

    <div class="inline-row">
      <label for="afterDate" class="icon-label" title="Borrar a partir de esta fecha">📆</label>
      <input type="date" id="afterDate">
      <button id="searchBtn" disabled>Buscar</button>
    </div>
    <div class="status" id="searchStatus"></div>

    <hr class="divider">

    <div class="inline-row">
      <label for="othersAfterDate" class="icon-label" title="Fecha desde">📆</label>
      <input type="date" id="othersAfterDate">
      <button class="secondary" id="othersBtn" disabled>Ver correos correctos</button>
    </div>
    <div class="checkfield">
      <input type="checkbox" id="allowDeleteOthers">
      <label for="allowDeleteOthers">Permitir borrar estos correos</label>
    </div>
    <div class="hint">Si no lo marcas, esta lista es solo de consulta (sin casillas ni botón de borrar).</div>
    <div class="status" id="othersStatus"></div>
  </div>

  <div class="panel" id="resultsPanel" style="display:none;">
    <div class="count" id="resultCount"></div>
    <hr class="divider">
    <ul class="results" id="resultsList"></ul>
    <div class="actions">
      <button class="secondary" id="selectAllBtn">Marcar todos</button>
      <button class="danger" id="deleteBtn">Borrar seleccionados</button>
    </div>
    <div class="status" id="deleteStatus"></div>
  </div>

  <div class="panel" id="othersPanel" style="display:none;">
    <div class="count" id="othersCount"></div>
    <hr class="divider">
    <ul class="results" id="othersList"></ul>
    <div class="actions">
      <button class="secondary" id="othersSelectAllBtn">Marcar todos</button>
      <button class="danger" id="othersDeleteBtn">Borrar seleccionados</button>
    </div>
    <div class="status" id="othersDeleteStatus"></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* === CONFIGURA ESTO === */
const CLIENT_ID = "268339815090-cevhlvjeujirbo0pccvi4qp2b0e8du6p.apps.googleusercontent.com";
/* ====================== */

const SCOPES = "https://www.googleapis.com/auth/gmail.modify";
let tokenClient = null;
let accounts = []; // { token, email }
let currentThreads = [];
let currentOtherThreads = [];

const authBtn = document.getElementById('authBtn');
const removeAccountBtn = document.getElementById('removeAccountBtn');
const accountsSelect = document.getElementById('accountsSelect');
const whoami = document.getElementById('whoami');
const setupNote = document.getElementById('setupNote');
const searchBtn = document.getElementById('searchBtn');
const searchStatus = document.getElementById('searchStatus');
const resultsPanel = document.getElementById('resultsPanel');
const resultsList = document.getElementById('resultsList');
const resultCount = document.getElementById('resultCount');
const selectAllBtn = document.getElementById('selectAllBtn');
const deleteBtn = document.getElementById('deleteBtn');
const deleteStatus = document.getElementById('deleteStatus');
const othersBtn = document.getElementById('othersBtn');
const othersStatus = document.getElementById('othersStatus');
const othersPanel = document.getElementById('othersPanel');
const othersList = document.getElementById('othersList');
const othersCount = document.getElementById('othersCount');
const othersSelectAllBtn = document.getElementById('othersSelectAllBtn');
const othersDeleteBtn = document.getElementById('othersDeleteBtn');
const othersDeleteStatus = document.getElementById('othersDeleteStatus');
const allowDeleteOthers = document.getElementById('allowDeleteOthers');

if(CLIENT_ID.includes("TU_CLIENT_ID")){
  setupNote.style.display = 'block';
  authBtn.disabled = true;
}

window.addEventListener('load', () => {
  if(CLIENT_ID.includes("TU_CLIENT_ID")) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if(resp.error){
        whoami.textContent = 'Error de autenticación: ' + resp.error;
        whoami.classList.add('err');
        return;
      }
      try{
        // Usamos el propio perfil de Gmail para saber el email de la cuenta;
        // esto ya está cubierto por el scope gmail.modify, sin pedir permisos nuevos.
        const profile = await gmailFetch(resp.access_token, '/profile');
        const email = (profile && profile.emailAddress) || `cuenta-${accounts.length + 1}`;
        const existing = accounts.find(a => a.email === email);
        if(existing){
          existing.token = resp.access_token;
        }else{
          accounts.push({ token: resp.access_token, email });
        }
        renderAccounts();
      }catch(e){
        console.error('No se pudo identificar la cuenta', e);
        accounts.push({ token: resp.access_token, email: `cuenta-${accounts.length + 1}` });
        renderAccounts();
      }
    }
  });
});

authBtn.addEventListener('click', () => {
  if(!tokenClient) return;
  tokenClient.requestAccessToken({ prompt: 'select_account' });
});

removeAccountBtn.addEventListener('click', () => {
  const idx = accountsSelect.selectedIndex;
  if(idx < 0 || !accounts[idx]) return;
  accounts.splice(idx, 1);
  renderAccounts();
});

function renderAccounts(){
  accountsSelect.innerHTML = '';
  if(!accounts.length){
    const opt = document.createElement('option');
    opt.textContent = 'Sin cuentas conectadas';
    accountsSelect.appendChild(opt);
    whoami.textContent = '';
    whoami.classList.remove('connected');
  }else{
    accounts.forEach(acc => {
      const opt = document.createElement('option');
      opt.textContent = acc.email;
      accountsSelect.appendChild(opt);
    });
    whoami.textContent = `${accounts.length} cuenta(s) conectada(s) · se busca en todas`;
    whoami.classList.add('connected');
  }
  searchBtn.disabled = !accounts.length;
  othersBtn.disabled = !accounts.length;
}

function getSenderList(){
  return document.getElementById('senders').value
    .split(',').map(s => s.trim()).filter(Boolean);
}

function toGmailDate(str){
  const m = str.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  const [, y, mo, d] = m;
  return `${y}/${mo}/${d}`;
}

function buildQuery(){
  const senders = getSenderList();
  const afterRaw = document.getElementById('afterDate').value.trim();
  let q = '';
  if(senders.length){
    q = '{' + senders.map(s=>`from:${s}`).join(' OR ') + '}';
  }
  if(afterRaw){
    const gd = toGmailDate(afterRaw);
    if(gd) q += (q ? ' ' : '') + `after:${gd}`;
  }
  return q;
}

function buildExcludeQuery(){
  const senders = getSenderList();
  const afterRaw = document.getElementById('othersAfterDate').value.trim();
  let q = 'in:inbox';
  if(senders.length){
    q += ' -{' + senders.map(s=>`from:${s}`).join(' OR ') + '}';
  }
  if(afterRaw){
    const gd = toGmailDate(afterRaw);
    if(gd) q += ` after:${gd}`;
  }
  return q;
}

async function gmailFetch(token, path, opts = {}){
  const res = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me${path}`, {
    ...opts,
    headers: {
      Authorization: `Bearer ${token}`,
      ...(opts.headers || {})
    }
  });
  if(res.status === 401){
    throw new Error('Token caducado en alguna cuenta. Pulsa "Añadir cuenta" para reconectarla.');
  }
  if(!res.ok){
    const txt = await res.text().catch(()=> '');
    throw new Error(`Error API Gmail (${res.status}): ${txt}`);
  }
  if(res.status === 204) return null;
  return res.json();
}

function header(headers, name){
  const h = (headers||[]).find(h => h.name.toLowerCase() === name.toLowerCase());
  return h ? h.value : '';
}

async function searchAcrossAccounts(query, statusEl){
  const allThreads = [];
  for(const acc of accounts){
    const list = await gmailFetch(acc.token, `/threads?q=${encodeURIComponent(query)}&maxResults=50`);
    const ids = (list.threads || []).map(t => t.id);

    const batchSize = 8;
    for(let i = 0; i < ids.length; i += batchSize){
      const slice = ids.slice(i, i + batchSize);
      const results = await Promise.all(slice.map(id =>
        gmailFetch(acc.token, `/threads/${id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`)
      ));
      results.forEach(r => { r.accountEmail = acc.email; r.accountToken = acc.token; });
      allThreads.push(...results);
      statusEl.innerHTML = `<span class="spin"></span>${acc.email}: ${allThreads.length} cargados…`;
    }
  }
  return allThreads;
}

async function doSearch(){
  const query = buildQuery();
  if(!getSenderList().length){
    searchStatus.textContent = 'Añade al menos un remitente.';
    searchStatus.classList.add('err');
    return;
  }
  if(!accounts.length){
    searchStatus.textContent = 'Conecta al menos una cuenta.';
    searchStatus.classList.add('err');
    return;
  }
  searchStatus.classList.remove('err');
  searchStatus.innerHTML = '<span class="spin"></span>Buscando…';
  searchBtn.disabled = true;
  resultsPanel.style.display = 'none';

  try{
    const threads = await searchAcrossAccounts(query, searchStatus);
    currentThreads = threads;
    renderResults(threads);
    searchStatus.textContent = threads.length
      ? `${threads.length} correo(s) encontrado(s) en ${accounts.length} cuenta(s).`
      : 'Sin resultados.';
  }catch(err){
    console.error(err);
    searchStatus.textContent = err.message || 'Error al buscar. Inténtalo de nuevo.';
    searchStatus.classList.add('err');
  }finally{
    searchBtn.disabled = false;
  }
}

function renderResults(threads){
  resultsList.innerHTML = '';
  if(!threads.length){
    resultsPanel.style.display = 'block';
    resultCount.textContent = '0 resultados';
    resultsList.innerHTML = '<div class="empty">No se encontraron correos con esos criterios.</div>';
    return;
  }
  resultCount.textContent = `${threads.length} resultado(s)`;
  threads.forEach((t, i) => {
    const msg = (t.messages && t.messages[0]) || {};
    const headers = msg.payload ? msg.payload.headers : [];
    const subject = header(headers, 'Subject') || '(sin asunto)';
    const from = header(headers, 'From') || '';
    const dateRaw = header(headers, 'Date');
    const dateStr = dateRaw ? new Date(dateRaw).toLocaleDateString('es-ES') : '';
    const li = document.createElement('li');
    li.innerHTML = `
      <input type="checkbox" checked data-idx="${i}">
      <div class="meta">
        <div class="subj">${subject.replace(/</g,'&lt;')}</div>
        <div class="sub">${from.replace(/</g,'&lt;')} · ${dateStr} · ${(t.accountEmail||'').replace(/</g,'&lt;')}</div>
      </div>
    `;
    resultsList.appendChild(li);
  });
  resultsPanel.style.display = 'block';
}

function renderOthers(threads){
  othersList.innerHTML = '';
  if(!threads.length){
    othersPanel.style.display = 'block';
    othersCount.textContent = '0 resultados';
    othersList.innerHTML = '<div class="empty">No hay correos en la bandeja que no coincidan.</div>';
    updateOthersReadonly();
    return;
  }
  othersCount.textContent = `${threads.length} correo(s) que NO se van a borrar`;
  threads.forEach((t, i) => {
    const msg = (t.messages && t.messages[0]) || {};
    const headers = msg.payload ? msg.payload.headers : [];
    const subject = header(headers, 'Subject') || '(sin asunto)';
    const from = header(headers, 'From') || '(remitente desconocido)';
    const dateRaw = header(headers, 'Date');
    const dateStr = dateRaw ? new Date(dateRaw).toLocaleDateString('es-ES') : '';
    const li = document.createElement('li');
    li.innerHTML = `
      <input type="checkbox" data-idx="${i}">
      <div class="meta">
        <div class="subj">${subject.replace(/</g,'&lt;')}</div>
        <div class="sub">${from.replace(/</g,'&lt;')} · ${dateStr} · ${(t.accountEmail||'').replace(/</g,'&lt;')}</div>
      </div>
    `;
    othersList.appendChild(li);
  });
  othersPanel.style.display = 'block';
  updateOthersReadonly();
}

function updateOthersReadonly(){
  othersPanel.classList.toggle('readonly', !allowDeleteOthers.checked);
}
allowDeleteOthers.addEventListener('change', updateOthersReadonly);

async function doOthersSearch(){
  const query = buildExcludeQuery();
  if(!accounts.length){
    othersStatus.textContent = 'Conecta al menos una cuenta.';
    othersStatus.classList.add('err');
    return;
  }
  othersStatus.classList.remove('err');
  othersStatus.innerHTML = '<span class="spin"></span>Buscando…';
  othersBtn.disabled = true;
  othersPanel.style.display = 'none';

  try{
    const threads = await searchAcrossAccounts(query, othersStatus);
    renderOthers(threads);
    currentOtherThreads = threads;
    othersStatus.textContent = threads.length
      ? `${threads.length} correo(s) que se conservan en ${accounts.length} cuenta(s).`
      : 'Sin resultados.';
  }catch(err){
    console.error(err);
    othersStatus.textContent = err.message || 'Error al buscar. Inténtalo de nuevo.';
    othersStatus.classList.add('err');
  }finally{
    othersBtn.disabled = false;
  }
}

async function trashThread(token, threadId){
  await gmailFetch(token, `/threads/${threadId}/trash`, { method: 'POST' });
}

async function doDelete(){
  const checked = Array.from(resultsList.querySelectorAll('input[type=checkbox]:checked'));
  if(!checked.length){
    deleteStatus.textContent = 'No hay correos seleccionados.';
    deleteStatus.classList.add('err');
    return;
  }
  deleteStatus.classList.remove('err');
  deleteBtn.disabled = true;
  let done = 0;
  deleteStatus.innerHTML = `<span class="spin"></span>Borrando 0/${checked.length}…`;

  for(const cb of checked){
    const idx = parseInt(cb.dataset.idx, 10);
    const thread = currentThreads[idx];
    try{
      await trashThread(thread.accountToken, thread.id);
      done++;
      deleteStatus.innerHTML = `<span class="spin"></span>Borrando ${done}/${checked.length}…`;
      cb.closest('li').style.opacity = '0.4';
    }catch(err){
      console.error('Error borrando', thread.id, err);
    }
  }

  deleteStatus.textContent = `${done} de ${checked.length} correo(s) borrado(s).`;
  deleteBtn.disabled = false;
  setTimeout(() => doSearch(), 900);
}

async function doDeleteOthers(){
  if(!allowDeleteOthers.checked) return;
  const checked = Array.from(othersList.querySelectorAll('input[type=checkbox]:checked'));
  if(!checked.length){
    othersDeleteStatus.textContent = 'No hay correos seleccionados.';
    othersDeleteStatus.classList.add('err');
    return;
  }
  othersDeleteStatus.classList.remove('err');
  othersDeleteBtn.disabled = true;
  let done = 0;
  othersDeleteStatus.innerHTML = `<span class="spin"></span>Borrando 0/${checked.length}…`;

  for(const cb of checked){
    const idx = parseInt(cb.dataset.idx, 10);
    const thread = currentOtherThreads[idx];
    try{
      await trashThread(thread.accountToken, thread.id);
      done++;
      othersDeleteStatus.innerHTML = `<span class="spin"></span>Borrando ${done}/${checked.length}…`;
      cb.closest('li').style.opacity = '0.4';
    }catch(err){
      console.error('Error borrando', thread.id, err);
    }
  }

  othersDeleteStatus.textContent = `${done} de ${checked.length} correo(s) borrado(s).`;
  othersDeleteBtn.disabled = false;
  setTimeout(() => doOthersSearch(), 900);
}

searchBtn.addEventListener('click', doSearch);
selectAllBtn.addEventListener('click', () => {
  const boxes = resultsList.querySelectorAll('input[type=checkbox]');
  const allChecked = Array.from(boxes).every(b => b.checked);
  boxes.forEach(b => b.checked = !allChecked);
});
deleteBtn.addEventListener('click', doDelete);
othersBtn.addEventListener('click', doOthersSearch);
othersSelectAllBtn.addEventListener('click', () => {
  const boxes = othersList.querySelectorAll('input[type=checkbox]');
  const allChecked = Array.from(boxes).every(b => b.checked);
  boxes.forEach(b => b.checked = !allChecked);
});
othersDeleteBtn.addEventListener('click', doDeleteOthers);

renderAccounts();
updateOthersReadonly();
</script>
</body>
</html>
