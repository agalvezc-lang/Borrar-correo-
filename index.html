<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limpieza de correo</title>
<style>
  :root{
    --ink:#1b1f1d;
    --paper:#f6f5f0;
    --panel:#ffffff;
    --line:#dedad0;
    --moss:#3f5d4c;
    --moss-dark:#2c4436;
    --rust:#b5502f;
    --muted:#7a7568;
    --danger:#a3312a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Courier New', ui-monospace, SFMono-Regular, monospace;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px;}
  header{
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  header h1{
    font-family:Georgia, 'Times New Roman', serif;
    font-size:1.5rem;
    letter-spacing:0.02em;
    margin:0;
  }
  header .tag{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.12em;}
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    padding:18px;
    margin-bottom:18px;
  }
  label{display:block;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:6px;}
  input[type=text]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    background:var(--paper);
    font-family:inherit;
    font-size:0.9rem;
    color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--moss);outline-offset:1px;}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .row{display:flex;gap:12px;}
  .row .field{flex:1;}
  button{
    font-family:inherit;
    font-size:0.85rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:11px 18px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
  }
  button:hover{background:var(--moss-dark);border-color:var(--moss-dark);}
  button:disabled{opacity:0.45;cursor:default;}
  button.secondary{background:transparent;color:var(--ink);}
  button.secondary:hover{background:var(--ink);color:var(--paper);}
  button.danger{background:var(--danger);border-color:var(--danger);}
  button.danger:hover{background:#7d221d;border-color:#7d221d;}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .status{
    font-size:0.8rem;
    color:var(--muted);
    margin-top:10px;
    min-height:1.2em;
  }
  .status.err{color:var(--danger);}
  ul.results{list-style:none;margin:0;padding:0;}
  ul.results li{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  ul.results li:last-child{border-bottom:none;}
  ul.results input[type=checkbox]{
    margin-top:3px;
    width:16px;height:16px;
    accent-color:var(--moss);
    flex-shrink:0;
  }
  .meta{flex:1;min-width:0;}
  .meta .subj{font-size:0.88rem;color:var(--ink);}
  .meta .sub{font-size:0.75rem;color:var(--muted);margin-top:3px;}
  .empty{color:var(--muted);font-size:0.85rem;text-align:center;padding:24px 0;}
  .count{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;}
  .divider{border:none;border-top:1px dashed var(--line);margin:16px 0;}
  .spin{
    display:inline-block;width:12px;height:12px;
    border:2px solid var(--line);border-top-color:var(--moss);
    border-radius:50%;
    animation:sp 0.7s linear infinite;
    vertical-align:middle;margin-right:6px;
  }
  @keyframes sp{to{transform:rotate(360deg);}}
  .authbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .authbar .who{font-size:0.75rem;color:var(--muted);}
  .who.connected{font-size:1.15rem;font-weight:700;color:var(--moss);letter-spacing:0.02em;}
  .who.disconnected{font-size:1.15rem;font-weight:700;color:var(--danger);letter-spacing:0.02em;animation:blink 1s step-start infinite;}
  @keyframes blink{50%{opacity:0.25;}}
  .setupnote{
    font-size:0.75rem;
    color:var(--rust);
    border:1px dashed var(--rust);
    padding:10px 12px;
    margin-bottom:18px;
    display:none;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Limpieza de correo</h1>
    <span class="tag">Gmail</span>
  </header>

  <div class="setupnote" id="setupNote">
    Falta configurar CLIENT_ID en el &lt;script&gt; (línea con <code>const CLIENT_ID</code>). Lee las instrucciones que te di aparte.
  </div>

  <div class="panel">
    <div class="authbar">
      <span class="who disconnected" id="whoami">Conectar</span>
      <button id="authBtn">Conectar con Google</button>
    </div>
  </div>

  <div class="panel">
    <div class="field">
      <label for="senders">Remitentes a buscar</label>
      <input type="text" id="senders" value="temu.com, orders.temu.com, eu.temuemail.com, support.temu.com, aliexpress.com, mondoffice.com, kalamazoo.es, sygic.com">
    </div>
    <div class="row">
      <div class="field">
        <label for="afterDate">Borrar a partir de</label>
        <input type="date" id="afterDate">
      </div>
    </div>
    <div class="actions">
      <button id="searchBtn" disabled>Buscar</button>
    </div>
    <div class="status" id="searchStatus"></div>
  </div>

  <div class="panel" id="resultsPanel" style="display:none;">
    <div class="count" id="resultCount"></div>
    <hr class="divider">
    <ul class="results" id="resultsList"></ul>
    <div class="actions">
      <button class="secondary" id="selectAllBtn">Marcar todos</button>
      <button class="danger" id="deleteBtn">Borrar seleccionados</button>
    </div>
    <div class="status" id="deleteStatus"></div>
  </div>

  <div class="panel">
    <div class="actions" style="margin-top:0;">
      <button class="secondary" id="othersBtn" disabled>Ver correos correctos (que no se van a borrar)</button>
    </div>
    <div class="status" id="othersStatus"></div>
  </div>

  <div class="panel" id="othersPanel" style="display:none;">
    <div class="count" id="othersCount"></div>
    <hr class="divider">
    <ul class="results" id="othersList"></ul>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* === CONFIGURA ESTO === */
const CLIENT_ID = "268339815090-cevhlvjeujirbo0pccvi4qp2b0e8du6p.apps.googleusercontent.com";
/* ====================== */

const SCOPES = "https://www.googleapis.com/auth/gmail.modify";
let accessToken = null;
let tokenClient = null;
let currentThreads = [];

const authBtn = document.getElementById('authBtn');
const whoami = document.getElementById('whoami');
const setupNote = document.getElementById('setupNote');
const searchBtn = document.getElementById('searchBtn');
const searchStatus = document.getElementById('searchStatus');
const resultsPanel = document.getElementById('resultsPanel');
const resultsList = document.getElementById('resultsList');
const resultCount = document.getElementById('resultCount');
const selectAllBtn = document.getElementById('selectAllBtn');
const deleteBtn = document.getElementById('deleteBtn');
const deleteStatus = document.getElementById('deleteStatus');
const othersBtn = document.getElementById('othersBtn');
const othersStatus = document.getElementById('othersStatus');
const othersPanel = document.getElementById('othersPanel');
const othersList = document.getElementById('othersList');
const othersCount = document.getElementById('othersCount');

if(CLIENT_ID.includes("TU_CLIENT_ID")){
  setupNote.style.display = 'block';
  authBtn.disabled = true;
}

window.addEventListener('load', () => {
  if(CLIENT_ID.includes("TU_CLIENT_ID")) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if(resp.error){
        whoami.textContent = 'Conectar';
        whoami.title = 'Error de autenticación: ' + resp.error;
        whoami.classList.remove('connected');
        whoami.classList.add('disconnected');
        return;
      }
      accessToken = resp.access_token;
      whoami.textContent = 'Conectado';
      whoami.classList.remove('disconnected');
      whoami.classList.add('connected');
      searchBtn.disabled = false;
      othersBtn.disabled = false;
      authBtn.textContent = 'Reconectar';
    }
  });
});

authBtn.addEventListener('click', () => {
  if(!tokenClient) return;
  tokenClient.requestAccessToken({ prompt: 'consent' });
});

function toGmailDate(str){
  const m = str.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  const [, y, mo, d] = m;
  return `${y}/${mo}/${d}`;
}

function buildQuery(){
  const sendersRaw = document.getElementById('senders').value.trim();
  const afterRaw = document.getElementById('afterDate').value.trim();
  const senders = sendersRaw.split(',').map(s=>s.trim()).filter(Boolean);
  let q = '';
  if(senders.length){
    q = '{' + senders.map(s=>`from:${s}`).join(' OR ') + '}';
  }
  if(afterRaw){
    const gd = toGmailDate(afterRaw);
    if(gd) q += (q ? ' ' : '') + `after:${gd}`;
  }
  return q;
}

function buildExcludeQuery(){
  const sendersRaw = document.getElementById('senders').value.trim();
  const senders = sendersRaw.split(',').map(s=>s.trim()).filter(Boolean);
  let q = 'in:inbox';
  if(senders.length){
    q += ' -{' + senders.map(s=>`from:${s}`).join(' OR ') + '}';
  }
  return q;
}

async function gmailFetch(path, opts = {}){
  const res = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me${path}`, {
    ...opts,
    headers: {
      Authorization: `Bearer ${accessToken}`,
      ...(opts.headers || {})
    }
  });
  if(res.status === 401){
    throw new Error('Token caducado. Pulsa "Reconectar".');
  }
  if(!res.ok){
    const txt = await res.text().catch(()=> '');
    throw new Error(`Error API Gmail (${res.status}): ${txt}`);
  }
  if(res.status === 204) return null;
  return res.json();
}

function header(headers, name){
  const h = (headers||[]).find(h => h.name.toLowerCase() === name.toLowerCase());
  return h ? h.value : '';
}

async function doSearch(){
  const query = buildQuery();
  if(!query){
    searchStatus.textContent = 'Escribe al menos un remitente.';
    searchStatus.classList.add('err');
    return;
  }
  searchStatus.classList.remove('err');
  searchStatus.innerHTML = '<span class="spin"></span>Buscando…';
  searchBtn.disabled = true;
  resultsPanel.style.display = 'none';

  try{
    const list = await gmailFetch(`/threads?q=${encodeURIComponent(query)}&maxResults=50`);
    const ids = (list.threads || []).map(t => t.id);

    // Trae metadata (asunto/remitente/fecha) de cada hilo, en tandas para no saturar
    const threads = [];
    const batchSize = 8;
    for(let i = 0; i < ids.length; i += batchSize){
      const slice = ids.slice(i, i + batchSize);
      const results = await Promise.all(slice.map(id =>
        gmailFetch(`/threads/${id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`)
      ));
      threads.push(...results);
      searchStatus.innerHTML = `<span class="spin"></span>Cargando ${threads.length}/${ids.length}…`;
    }

    currentThreads = threads;
    renderResults(threads);
    searchStatus.textContent = threads.length
      ? `${threads.length} correo(s) encontrado(s).`
      : 'Sin resultados.';
  }catch(err){
    console.error(err);
    searchStatus.textContent = err.message || 'Error al buscar. Inténtalo de nuevo.';
    searchStatus.classList.add('err');
  }finally{
    searchBtn.disabled = false;
  }
}

function renderResults(threads){
  resultsList.innerHTML = '';
  if(!threads.length){
    resultsPanel.style.display = 'block';
    resultCount.textContent = '0 resultados';
    resultsList.innerHTML = '<div class="empty">No se encontraron correos con esos criterios.</div>';
    return;
  }
  resultCount.textContent = `${threads.length} resultado(s)`;
  threads.forEach((t, i) => {
    const msg = (t.messages && t.messages[0]) || {};
    const headers = msg.payload ? msg.payload.headers : [];
    const subject = header(headers, 'Subject') || '(sin asunto)';
    const from = header(headers, 'From') || '';
    const dateRaw = header(headers, 'Date');
    const dateStr = dateRaw ? new Date(dateRaw).toLocaleDateString('es-ES') : '';
    const li = document.createElement('li');
    li.innerHTML = `
      <input type="checkbox" checked data-idx="${i}">
      <div class="meta">
        <div class="subj">${subject.replace(/</g,'&lt;')}</div>
        <div class="sub">${from.replace(/</g,'&lt;')} · ${dateStr}</div>
      </div>
    `;
    resultsList.appendChild(li);
  });
  resultsPanel.style.display = 'block';
}

function renderOthers(threads){
  othersList.innerHTML = '';
  if(!threads.length){
    othersPanel.style.display = 'block';
    othersCount.textContent = '0 resultados';
    othersList.innerHTML = '<div class="empty">No hay correos en la bandeja que no coincidan.</div>';
    return;
  }
  othersCount.textContent = `${threads.length} correo(s) que NO se van a borrar`;
  threads.forEach(t => {
    const msg = (t.messages && t.messages[0]) || {};
    const headers = msg.payload ? msg.payload.headers : [];
    const subject = header(headers, 'Subject') || '(sin asunto)';
    const from = header(headers, 'From') || '';
    const dateRaw = header(headers, 'Date');
    const dateStr = dateRaw ? new Date(dateRaw).toLocaleDateString('es-ES') : '';
    const li = document.createElement('li');
    li.innerHTML = `
      <div class="meta">
        <div class="subj">${subject.replace(/</g,'&lt;')}</div>
        <div class="sub">${from.replace(/</g,'&lt;')} · ${dateStr}</div>
      </div>
    `;
    othersList.appendChild(li);
  });
  othersPanel.style.display = 'block';
}

async function doOthersSearch(){
  const query = buildExcludeQuery();
  othersStatus.classList.remove('err');
  othersStatus.innerHTML = '<span class="spin"></span>Buscando…';
  othersBtn.disabled = true;
  othersPanel.style.display = 'none';

  try{
    const list = await gmailFetch(`/threads?q=${encodeURIComponent(query)}&maxResults=50`);
    const ids = (list.threads || []).map(t => t.id);

    const threads = [];
    const batchSize = 8;
    for(let i = 0; i < ids.length; i += batchSize){
      const slice = ids.slice(i, i + batchSize);
      const results = await Promise.all(slice.map(id =>
        gmailFetch(`/threads/${id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`)
      ));
      threads.push(...results);
      othersStatus.innerHTML = `<span class="spin"></span>Cargando ${threads.length}/${ids.length}…`;
    }

    renderOthers(threads);
    othersStatus.textContent = threads.length
      ? `${threads.length} correo(s) que se conservan.`
      : 'Sin resultados.';
  }catch(err){
    console.error(err);
    othersStatus.textContent = err.message || 'Error al buscar. Inténtalo de nuevo.';
    othersStatus.classList.add('err');
  }finally{
    othersBtn.disabled = false;
  }
}

async function trashThread(threadId){
  await gmailFetch(`/threads/${threadId}/trash`, { method: 'POST' });
}

async function doDelete(){
  const checked = Array.from(resultsList.querySelectorAll('input[type=checkbox]:checked'));
  if(!checked.length){
    deleteStatus.textContent = 'No hay correos seleccionados.';
    deleteStatus.classList.add('err');
    return;
  }
  deleteStatus.classList.remove('err');
  deleteBtn.disabled = true;
  let done = 0;
  deleteStatus.innerHTML = `<span class="spin"></span>Borrando 0/${checked.length}…`;

  for(const cb of checked){
    const idx = parseInt(cb.dataset.idx, 10);
    const thread = currentThreads[idx];
    try{
      await trashThread(thread.id);
      done++;
      deleteStatus.innerHTML = `<span class="spin"></span>Borrando ${done}/${checked.length}…`;
      cb.closest('li').style.opacity = '0.4';
    }catch(err){
      console.error('Error borrando', thread.id, err);
    }
  }

  deleteStatus.textContent = `${done} de ${checked.length} correo(s) borrado(s).`;
  deleteBtn.disabled = false;
  setTimeout(() => doSearch(), 900);
}

searchBtn.addEventListener('click', doSearch);
selectAllBtn.addEventListener('click', () => {
  const boxes = resultsList.querySelectorAll('input[type=checkbox]');
  const allChecked = Array.from(boxes).every(b => b.checked);
  boxes.forEach(b => b.checked = !allChecked);
});
deleteBtn.addEventListener('click', doDelete);
othersBtn.addEventListener('click', doOthersSearch);
</script>
</body>
</html>
