<meta name="theme-color" content="#4f46e5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f0f2f5;
    --surface:#ffffff;
    --surface-alt:#f8f9fb;
    --ink:#1a1d23;
    --ink-sec:#5f6672;
    --ink-mut:#9aa1ad;
    --pri:#4f46e5;
    --pri-h:#4338ca;
    --pri-l:#eef2ff;
    --pri-g:rgba(79,70,229,0.12);
    --dang:#ef4444;
    --dang-h:#dc2626;
    --succ:#10b981;
    --border:#e5e7eb;
    --sh-s:0 1px 2px rgba(0,0,0,0.04);
    --sh-m:0 3px 8px rgba(0,0,0,0.06);
    --r:10px;
    --r-s:7px;
    --tr:all 0.15s ease;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:440px;margin:0 auto;padding:6px 8px 12px;}

  header{text-align:center;margin-bottom:6px;padding:2px 0;}
  header h1{
    font-size:1rem;font-weight:700;letter-spacing:-0.02em;
    background:linear-gradient(135deg,var(--ink),var(--pri));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  header .tag{
    display:inline-block;font-size:0.55rem;font-weight:600;color:var(--pri);
    background:var(--pri-l);padding:1px 6px;border-radius:10px;
    text-transform:uppercase;letter-spacing:0.08em;margin-top:1px;
  }

  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r);padding:8px 10px;margin-bottom:6px;
    box-shadow:var(--sh-s);transition:var(--tr);
  }
  .card:hover{box-shadow:var(--sh-m);}
  .card-title{
    font-size:0.58rem;font-weight:600;text-transform:uppercase;
    letter-spacing:0.1em;color:var(--ink-mut);margin-bottom:5px;
    display:flex;align-items:center;gap:5px;
  }
  .card-title::before{content:'';width:3px;height:10px;background:var(--pri);border-radius:2px;}

  .authbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .authbar .who-wrap{flex:1;display:flex;}
  .authbar .auth-wrap{flex:1;display:flex;justify-content:flex-end;}
  .who{font-size:1rem;font-weight:800;}
  .who.connected{color:#00c853;}
  .who.disconnected{color:#ff1744;animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}

  button{
    font-family:inherit;font-size:0.72rem;font-weight:600;
    padding:5px 10px;border:none;border-radius:var(--r-s);
    cursor:pointer;transition:var(--tr);display:inline-flex;
    align-items:center;gap:4px;flex-shrink:0;
  }
  button:active{transform:scale(0.97);}
  button:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
  .btn-p{background:var(--pri);color:#fff;box-shadow:0 2px 6px var(--pri-g);}
  .btn-p:hover:not(:disabled){background:var(--pri-h);}
  .btn-s{background:var(--surface-alt);color:var(--ink);border:1px solid var(--border);}
  .btn-s:hover:not(:disabled){background:var(--border);}
  .btn-d{background:var(--dang);color:#fff;}
  .btn-d:hover:not(:disabled){background:var(--dang-h);}
  .btn-sm{padding:4px 8px;font-size:0.65rem;}

  input[type=text],input[type=date],select,textarea{
    font-family:inherit;font-size:0.78rem;color:var(--ink);
    background:var(--surface-alt);border:1.5px solid var(--border);
    border-radius:var(--r-s);padding:5px 8px;transition:var(--tr);width:100%;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-g);background:var(--surface);
  }
  input::placeholder{color:var(--ink-mut);}
  input[type=date]{width:auto;max-width:118px;padding:4px 5px;font-size:0.72rem;}
  select{cursor:pointer;}
  textarea{resize:vertical;line-height:1.4;font-family:'JetBrains Mono',monospace;font-size:0.7rem;}

  .row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .row+.row{margin-top:4px;}
  .row-label{font-size:0.8rem;flex-shrink:0;}

  .senders-details{width:100%;margin-top:3px;}
  .senders-details summary{
    font-size:0.65rem;font-weight:500;color:var(--pri);
    cursor:pointer;list-style:none;padding:2px 0;
    display:flex;align-items:center;gap:3px;
  }
  .senders-details summary::-webkit-details-marker{display:none;}
  .senders-details summary::before{content:'›';font-weight:700;transition:transform 0.15s;}
  .senders-details[open] summary::before{transform:rotate(90deg);}
  .senders-details textarea{margin-top:3px;}

  .checkfield{
    display:flex;align-items:center;gap:6px;margin-top:5px;
    padding:5px 8px;background:var(--surface-alt);
    border-radius:var(--r-s);border:1px solid var(--border);
    cursor:pointer;transition:var(--tr);
  }
  .checkfield:hover{border-color:var(--pri);background:var(--pri-l);}
  .checkfield input[type=checkbox]{width:15px;height:15px;accent-color:var(--pri);cursor:pointer;}
  .checkfield label{font-size:0.75rem;font-weight:500;cursor:pointer;}
  .checkfield-inline{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:0.7rem;font-weight:500;white-space:nowrap;flex-shrink:0;}
  .checkfield-inline input[type=checkbox]{width:15px;height:15px;accent-color:var(--pri);cursor:pointer;}
  .hint{font-size:0.62rem;color:var(--ink-mut);margin-top:2px;}

  .status{font-size:0.7rem;color:var(--ink-sec);margin-top:4px;min-height:1em;display:flex;align-items:center;gap:5px;}
  .status.err{color:var(--dang);}

  .results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
  .count-badge{font-size:0.62rem;font-weight:600;color:var(--pri);background:var(--pri-l);padding:2px 7px;border-radius:12px;}
  ul.results{list-style:none;padding:0;}
  ul.results li{
    display:flex;gap:8px;align-items:flex-start;
    padding:5px 0;border-bottom:1px solid var(--border);transition:var(--tr);
  }
  ul.results li:last-child{border-bottom:none;}
  ul.results li:hover{background:var(--surface-alt);margin:0 -6px;padding:5px 6px;border-radius:var(--r-s);}
  ul.results input[type=checkbox]{width:15px;height:15px;accent-color:var(--pri);margin-top:1px;flex-shrink:0;cursor:pointer;}
  .meta{flex:1;min-width:0;cursor:pointer;}
  .meta:active{opacity:0.7;}
  .meta .subj{font-size:0.78rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meta .sub{font-size:0.65rem;color:var(--ink-mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .empty{color:var(--ink-mut);font-size:0.78rem;text-align:center;padding:12px 0;}

  .actions{display:flex;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);flex-wrap:wrap;}

  #othersPanel.readonly .actions{display:none;}
  #othersPanel.readonly ul.results input[type=checkbox]{display:none;}

  .spin{
    display:inline-block;width:12px;height:12px;
    border:2px solid var(--border);border-top-color:var(--pri);
    border-radius:50%;animation:sp 0.7s linear infinite;flex-shrink:0;
  }
  @keyframes sp{to{transform:rotate(360deg);}}

  .setupnote{
    font-size:0.72rem;color:#b45309;background:#fef3c7;
    border:1px solid #f59e0b;border-radius:var(--r-s);
    padding:6px 9px;margin-bottom:6px;display:none;
  }

  .account-row{display:flex;gap:5px;margin-top:5px;align-items:center;}
  .account-row select{flex:1;}

  .divider{border:none;border-top:1px solid var(--border);margin:6px 0;}

  @media(max-width:480px){
    .wrap{padding:5px 6px 10px;}
    header h1{font-size:0.95rem;}
    .card{padding:7px 8px;}
    button{padding:5px 9px;font-size:0.7rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Limpieza de correo</h1>
    <span class="tag">✉ Gmail</span>
  </header>

  <div class="setupnote" id="setupNote">⚠️ Falta configurar CLIENT_ID en el script.</div>

  <div class="card">
    <div class="card-title">Conexión</div>
    <div class="authbar">
      <span class="who-wrap"><span class="who disconnected" id="whoami">Sin conexión</span></span>
      <button type="button" id="emptyTrashBtn" class="btn-d btn-sm" disabled>🗑️ Vaciar papelera</button>
      <span class="auth-wrap"><button id="authBtn" class="btn-p">Conectar con Google</button></span>
    </div>
    <div class="account-row" id="accountSwitchRow" style="display:none;">
      <select id="accountsSelect"></select>
      <button type="button" id="removeAccountBtn" class="btn-s btn-sm">✕</button>
    </div>
    <div class="status" id="emptyTrashStatus"></div>
  </div>

  <div class="card">
    <div class="card-title">Buscar spam</div>
    <div class="row">
      <input type="text" id="senderInput" placeholder="ej: temu.com" style="flex:1;min-width:0;">
      <button type="button" id="addSenderBtn" class="btn-s btn-sm">+</button>
      <input type="date" id="afterDate">
      <button id="searchBtn" class="btn-p btn-sm" disabled>Buscar</button>
    </div>
    <details class="senders-details" id="sendersBox">
      <summary id="sendersSummary">0 remitentes</summary>
      <textarea id="senders" rows="2">temu.com, orders.temu.com, eu.temuemail.com, support.temu.com, aliexpress.com, mondoffice.com, kalamazoo.es, sygic.com</textarea>
    </details>
    <div class="status" id="searchStatus"></div>
  </div>

  <div class="card">
    <div class="card-title">Correos correctos</div>
    <div class="row">
      <input type="date" id="othersAfterDate">
      <button class="btn-s btn-sm" id="othersBtn" disabled>Ver bandeja</button>
      <label class="checkfield-inline" for="allowDeleteOthers">
        <input type="checkbox" id="allowDeleteOthers">
        <span>Permitir borrar</span>
      </label>
    </div>
    <div class="hint">Sin marcar → solo consulta.</div>
    <div class="status" id="othersStatus"></div>
  </div>

  <div class="card" id="resultsPanel" style="display:none;">
    <div class="results-header">
      <span class="count-badge" id="resultCount"></span>
      <button class="btn-s btn-sm" id="closeResultsBtn" type="button">✕</button>
    </div>
    <ul class="results" id="resultsList"></ul>
    <div class="actions">
      <button class="btn-s btn-sm" id="selectAllBtn">☑ Todos</button>
      <button class="btn-d btn-sm" id="deleteBtn">🗑 Borrar</button>
    </div>
    <div class="status" id="deleteStatus"></div>
  </div>

  <div class="card" id="othersPanel" style="display:none;">
    <div class="results-header">
      <span class="count-badge" id="othersCount"></span>
      <button class="btn-s btn-sm" id="closeOthersBtn" type="button">✕</button>
    </div>
    <ul class="results" id="othersList"></ul>
    <div class="actions">
      <button class="btn-s btn-sm" id="othersSelectAllBtn">☑ Todos</button>
      <button class="btn-d btn-sm" id="othersDeleteBtn">🗑 Borrar</button>
    </div>
    <div class="status" id="othersDeleteStatus"></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CLIENT_ID = "268339815090-cevhlvjeujirbo0pccvi4qp2b0e8du6p.apps.googleusercontent.com";
const SCOPES = "https://mail.google.com/";
let tokenClient=null,accounts=[],currentThreads=[],currentOtherThreads=[];

const $=id=>document.getElementById(id);
const authBtn=$('authBtn'),removeAccountBtn=$('removeAccountBtn'),accountsSelect=$('accountsSelect'),
accountSwitchRow=$('accountSwitchRow'),whoami=$('whoami'),setupNote=$('setupNote'),
senderInput=$('senderInput'),addSenderBtn=$('addSenderBtn'),sendersSummary=$('sendersSummary'),
searchBtn=$('searchBtn'),searchStatus=$('searchStatus'),resultsPanel=$('resultsPanel'),
resultsList=$('resultsList'),resultCount=$('resultCount'),selectAllBtn=$('selectAllBtn'),
deleteBtn=$('deleteBtn'),deleteStatus=$('deleteStatus'),othersBtn=$('othersBtn'),
othersStatus=$('othersStatus'),othersPanel=$('othersPanel'),othersList=$('othersList'),
othersCount=$('othersCount'),othersSelectAllBtn=$('othersSelectAllBtn'),
othersDeleteBtn=$('othersDeleteBtn'),othersDeleteStatus=$('othersDeleteStatus'),
allowDeleteOthers=$('allowDeleteOthers'),emptyTrashBtn=$('emptyTrashBtn'),emptyTrashStatus=$('emptyTrashStatus');

if(CLIENT_ID.includes("TU_CLIENT_ID")){setupNote.style.display='block';authBtn.disabled=true;}

window.addEventListener('load',()=>{
  if(CLIENT_ID.includes("TU_CLIENT_ID"))return;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,scope:SCOPES,
    callback:async resp=>{
      if(resp.error){whoami.textContent='Sin conexión';whoami.className='who disconnected';return;}
      let email=`cuenta-${accounts.length+1}`;
      try{const p=await gmailFetch(resp.access_token,'/profile');if(p&&p.emailAddress)email=p.emailAddress;}catch(e){}
      const ex=accounts.find(a=>a.email===email);
      if(ex)ex.token=resp.access_token;else accounts.push({token:resp.access_token,email});
      whoami.textContent='✓ Conectado';whoami.className='who connected';
      authBtn.textContent='Reconectar';renderAccounts();
    }
  });
});

authBtn.onclick=()=>{if(tokenClient)tokenClient.requestAccessToken({prompt:'consent'});};
removeAccountBtn.onclick=()=>{const i=accountsSelect.selectedIndex;if(i<0||!accounts[i])return;accounts.splice(i,1);renderAccounts();};

function renderAccounts(){
  accountsSelect.innerHTML='';
  accounts.forEach(a=>{const o=document.createElement('option');o.textContent=a.email;accountsSelect.appendChild(o);});
  accountSwitchRow.style.display=accounts.length?'flex':'none';
  if(!accounts.length){whoami.textContent='Sin conexión';whoami.className='who disconnected';}
  searchBtn.disabled=!accounts.length;othersBtn.disabled=!accounts.length;emptyTrashBtn.disabled=!accounts.length;
}

function getSenderList(){return $('senders').value.split(',').map(s=>s.trim()).filter(Boolean);}
function updateSendersSummary(){const n=getSenderList().length;sendersSummary.textContent=`${n} remitente${n!==1?'s':''}`;}

function addSenderFromInput(){
  const raw=senderInput.value.trim();if(!raw)return;
  const list=getSenderList();
  raw.split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>{if(!list.includes(s))list.push(s);});
  $('senders').value=list.join(', ');senderInput.value='';updateSendersSummary();
}
addSenderBtn.onclick=addSenderFromInput;
senderInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addSenderFromInput();}};
$('senders').oninput=updateSendersSummary;

function toGmailDate(s){const m=s.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[1]}/${m[2]}/${m[3]}`:null;}

function buildQuery(){
  const snd=getSenderList(),ad=$('afterDate').value.trim();let q='';
  if(snd.length)q='{'+snd.map(s=>`from:${s}`).join(' OR ')+'}';
  if(ad){const g=toGmailDate(ad);if(g)q+=(q?' ':'')+`after:${g}`;}
  return q;
}
function buildExcludeQuery(){
  const snd=getSenderList(),ad=$('othersAfterDate').value.trim();let q='in:inbox';
  if(snd.length)q+=' -{'+snd.map(s=>`from:${s}`).join(' OR ')+'}';
  if(ad){const g=toGmailDate(ad);if(g)q+=` after:${g}`;}
  return q;
}

async function gmailFetch(token,path,opts={}){
  const res=await fetch(`https://gmail.googleapis.com/gmail/v1/users/me${path}`,{...opts,headers:{Authorization:`Bearer ${token}`,...(opts.headers||{})}});
  if(res.status===401)throw new Error('Token caducado. Reconecta.');
  if(!res.ok){const t=await res.text().catch(()=> '');throw new Error(`Error ${res.status}: ${t}`);}
  if(res.status===204)return null;return res.json();
}

function header(hs,n){const h=(hs||[]).find(h=>h.name.toLowerCase()===n.toLowerCase());return h?h.value:'';}

async function searchAcrossAccounts(query,stEl){
  const all=[];
  for(const acc of accounts){
    const list=await gmailFetch(acc.token,`/threads?q=${encodeURIComponent(query)}&maxResults=50`);
    const ids=(list.threads||[]).map(t=>t.id);
    for(let i=0;i<ids.length;i+=8){
      const sl=ids.slice(i,i+8);
      const rs=await Promise.all(sl.map(id=>gmailFetch(acc.token,`/threads/${id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`)));
      rs.forEach(r=>{r.accountEmail=acc.email;r.accountToken=acc.token;});
      all.push(...rs);
      stEl.innerHTML=`<span class="spin"></span>${acc.email}: ${all.length}…`;
    }
  }
  return all;
}

async function doSearch(){
  if(!getSenderList().length){searchStatus.textContent='⚠ Añade un remitente.';searchStatus.className='status err';return;}
  if(!accounts.length){searchStatus.textContent='⚠ Conecta una cuenta.';searchStatus.className='status err';return;}
  searchStatus.className='status';searchStatus.innerHTML='<span class="spin"></span>Buscando…';
  searchBtn.disabled=true;resultsPanel.style.display='none';
  try{
    const t=await searchAcrossAccounts(buildQuery(),searchStatus);
    currentThreads=t;renderResults(t);
    searchStatus.textContent=t.length?`✓ ${t.length} en ${accounts.length} cuenta(s).`:'Sin resultados.';
  }catch(e){searchStatus.textContent=e.message;searchStatus.className='status err';}
  finally{searchBtn.disabled=false;}
}

function renderResults(threads){
  resultsList.innerHTML='';
  if(!threads.length){resultsPanel.style.display='block';resultCount.textContent='0';resultsList.innerHTML='<div class="empty">Sin resultados.</div>';return;}
  resultCount.textContent=`${threads.length} resultado(s)`;
  threads.forEach((t,i)=>{
    const msg=(t.messages&&t.messages[0])||{},hs=msg.payload?msg.payload.headers:[];
    const subj=header(hs,'Subject')||'(sin asunto)',from=header(hs,'From')||'',dr=header(hs,'Date');
    const ds=dr?new Date(dr).toLocaleDateString('es-ES'):'';
    const li=document.createElement('li');
    li.innerHTML=`<input type="checkbox" checked data-idx="${i}"><div class="meta" data-thread-id="${t.id}" data-account="${(t.accountEmail||'').replace(/"/g,'&quot;')}"><div class="subj">${subj.replace(/</g,'&lt;')}</div><div class="sub">${from.replace(/</g,'&lt;')} · ${ds} · ${(t.accountEmail||'').replace(/</g,'&lt;')}</div></div>`;
    resultsList.appendChild(li);
  });
  resultsPanel.style.display='block';attachDblTap(resultsList);
}

function renderOthers(threads){
  othersList.innerHTML='';
  if(!threads.length){othersPanel.style.display='block';othersCount.textContent='0';othersList.innerHTML='<div class="empty">Bandeja limpia.</div>';updateRO();return;}
  othersCount.textContent=`${threads.length} conservados`;
  threads.forEach((t,i)=>{
    const msg=(t.messages&&t.messages[0])||{},hs=msg.payload?msg.payload.headers:[];
    const subj=header(hs,'Subject')||'(sin asunto)',from=header(hs,'From')||'',dr=header(hs,'Date');
    const ds=dr?new Date(dr).toLocaleDateString('es-ES'):'';
    const li=document.createElement('li');
    li.innerHTML=`<input type="checkbox" data-idx="${i}"><div class="meta" data-thread-id="${t.id}" data-account="${(t.accountEmail||'').replace(/"/g,'&quot;')}"><div class="subj">${subj.replace(/</g,'&lt;')}</div><div class="sub">${from.replace(/</g,'&lt;')} · ${ds} · ${(t.accountEmail||'').replace(/</g,'&lt;')}</div></div>`;
    othersList.appendChild(li);
  });
  othersPanel.style.display='block';updateRO();attachDblTap(othersList);
}

let lastTap={el:null,time:0};
function attachDblTap(c){
  c.querySelectorAll('.meta[data-thread-id]').forEach(el=>{
    el.addEventListener('click',e=>{
      const now=Date.now(),dbl=lastTap.el===el&&(now-lastTap.time)<450;
      lastTap={el,time:now};
      if(dbl){e.preventDefault();window.open(`https://mail.google.com/mail/?authuser=${encodeURIComponent(el.dataset.account||'')}#all/${el.dataset.threadId}`,'_blank');lastTap={el:null,time:0};}
    });
  });
}

function updateRO(){othersPanel.classList.toggle('readonly',!allowDeleteOthers.checked);}
allowDeleteOthers.onchange=updateRO;

async function doOthersSearch(){
  if(!accounts.length){othersStatus.textContent='⚠ Conecta una cuenta.';othersStatus.className='status err';return;}
  othersStatus.className='status';othersStatus.innerHTML='<span class="spin"></span>Buscando…';
  othersBtn.disabled=true;othersPanel.style.display='none';
  try{
    const t=await searchAcrossAccounts(buildExcludeQuery(),othersStatus);
    currentOtherThreads=t;renderOthers(t);
    othersStatus.textContent=t.length?`✓ ${t.length} en ${accounts.length} cuenta(s).`:'Sin resultados.';
  }catch(e){othersStatus.textContent=e.message;othersStatus.className='status err';}
  finally{othersBtn.disabled=false;}
}

async function trashThread(tk,id){await gmailFetch(tk,`/threads/${id}/trash`,{method:'POST'});}

async function doDelete(){
  const cbs=Array.from(resultsList.querySelectorAll('input:checked'));
  if(!cbs.length){deleteStatus.textContent='⚠ Nada seleccionado.';deleteStatus.className='status err';return;}
  deleteStatus.className='status';deleteBtn.disabled=true;let done=0;
  deleteStatus.innerHTML=`<span class="spin"></span>0/${cbs.length}…`;
  for(const cb of cbs){
    const t=currentThreads[parseInt(cb.dataset.idx)];
    try{await trashThread(t.accountToken,t.id);done++;deleteStatus.innerHTML=`<span class="spin"></span>${done}/${cbs.length}…`;cb.closest('li').style.opacity='0.35';}catch(e){}
  }
  deleteStatus.textContent=`✓ ${done}/${cbs.length} borrados.`;deleteBtn.disabled=false;
  setTimeout(doSearch,800);
}

async function doDeleteOthers(){
  if(!allowDeleteOthers.checked)return;
  const cbs=Array.from(othersList.querySelectorAll('input:checked'));
  if(!cbs.length){othersDeleteStatus.textContent='⚠ Nada seleccionado.';othersDeleteStatus.className='status err';return;}
  othersDeleteStatus.className='status';othersDeleteBtn.disabled=true;let done=0;
  othersDeleteStatus.innerHTML=`<span class="spin"></span>0/${cbs.length}…`;
  for(const cb of cbs){
    const t=currentOtherThreads[parseInt(cb.dataset.idx)];
    try{await trashThread(t.accountToken,t.id);done++;othersDeleteStatus.innerHTML=`<span class="spin"></span>${done}/${cbs.length}…`;cb.closest('li').style.opacity='0.35';}catch(e){}
  }
  othersDeleteStatus.textContent=`✓ ${done}/${cbs.length} borrados.`;othersDeleteBtn.disabled=false;
  setTimeout(doOthersSearch,800);
}

async function listTrashIds(token){
  const ids=[];let pageToken;
  do{
    const p=new URLSearchParams({q:'in:trash',maxResults:'500'});
    if(pageToken)p.set('pageToken',pageToken);
    const r=await gmailFetch(token,`/messages?${p.toString()}`);
    (r.messages||[]).forEach(m=>ids.push(m.id));
    pageToken=r.nextPageToken;
  }while(pageToken);
  return ids;
}

async function batchDelete(token,ids){
  for(let i=0;i<ids.length;i+=1000){
    const chunk=ids.slice(i,i+1000);
    await gmailFetch(token,'/messages/batchDelete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:chunk})});
  }
}

async function emptyTrashAllAccounts(){
  if(!accounts.length)return;
  if(!confirm('Esto borrará PERMANENTEMENTE la papelera de todas las cuentas conectadas. ¿Continuar?'))return;
  emptyTrashBtn.disabled=true;emptyTrashStatus.className='status';
  let totalDone=0,totalFound=0;
  for(const acc of accounts){
    try{
      emptyTrashStatus.innerHTML=`<span class="spin"></span>${acc.email}: buscando…`;
      const ids=await listTrashIds(acc.token);
      totalFound+=ids.length;
      if(ids.length){
        emptyTrashStatus.innerHTML=`<span class="spin"></span>${acc.email}: borrando ${ids.length}…`;
        await batchDelete(acc.token,ids);
        totalDone+=ids.length;
      }
    }catch(e){
      emptyTrashStatus.textContent=`⚠ ${acc.email}: ${e.message}`;emptyTrashStatus.className='status err';
    }
  }
  emptyTrashStatus.textContent=totalFound?`✓ ${totalDone}/${totalFound} borrados de ${accounts.length} cuenta(s).`:'Papelera ya vacía en todas las cuentas.';
  emptyTrashBtn.disabled=false;
}
emptyTrashBtn.onclick=emptyTrashAllAccounts;

searchBtn.onclick=doSearch;
selectAllBtn.onclick=()=>{const b=resultsList.querySelectorAll('input[type=checkbox]');const all=Array.from(b).every(x=>x.checked);b.forEach(x=>x.checked=!all);};
deleteBtn.onclick=doDelete;
othersBtn.onclick=doOthersSearch;
othersSelectAllBtn.onclick=()=>{const b=othersList.querySelectorAll('input[type=checkbox]');const all=Array.from(b).every(x=>x.checked);b.forEach(x=>x.checked=!all);};
othersDeleteBtn.onclick=doDeleteOthers;
$('closeResultsBtn').onclick=()=>resultsPanel.style.display='none';
$('closeOthersBtn').onclick=()=>othersPanel.style.display='none';

renderAccounts();updateRO();updateSendersSummary();
</script>
</body>
</html>
